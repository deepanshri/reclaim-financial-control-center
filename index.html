<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reclaim — Financial Control Center</title>
    <meta name="description" content="Settlement auditor for merchants. This deployment uses a synthetic Razorpay-style demo dataset, not a live payment gateway." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F5F0" />
    <meta property="og:title" content="Reclaim — Financial Control Center" />
    <meta property="og:description" content="Settlement auditor workspace. Synthetic demo dataset — not a live payment gateway." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Wake the API before the font stylesheets and the app bundle are fetched.
      // The module script below cannot run until the stylesheets above resolve, so
      // starting the ping here saves that time on the first sign-in of a session.
      (function () {
        var base = '%VITE_API_BASE_URL%';
        if (base.charAt(0) === '%') base = '';
        base = base.trim().replace(/\/$/, '');
        var isLocal = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
        if (!base && !isLocal) base = 'https://reclaim-financial-control-center.onrender.com';
        window.__reclaimApiBase = base;
        try {
          window.__reclaimPrewarm = fetch(base + '/api/health', {
            method: 'GET',
            credentials: 'omit',
            cache: 'no-store',
          }).then(
            function () {},
            function () {}
          );
        } catch (e) {
          /* prewarm is best effort */
        }
      })();
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Satoshi: body copy -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
    <!-- Playfair Display, Plus Jakarta Sans, JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F5F5F0] dark:bg-[#141311] text-[#1C1917] dark:text-[#F4F0E8] antialiased selection:bg-[#B8522E] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
